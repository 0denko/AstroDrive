; Optional PlatformIO configuration for building OnStepX on NodeMCU ESP8266.
; Note: `firmware/build.sh` (arduino-cli + esp8266@3.1.2) is the primary recommended
; build path because OnStepX relies on Arduino preprocessor conventions.
;
; Usage:
;   1. Clone https://github.com/hjd1964/OnStepX into firmware/src/OnStepX
;   2. Copy firmware/Config.h and firmware/Extended.config.h into firmware/src/OnStepX/
;   3. Run: pio run -d firmware -e nodemcuv2

[platformio]
src_dir = src/OnStepX

[env:nodemcuv2]
; espressif8266@4.2.1 ships Arduino ESP8266 core 3.1.2 (required by OnStepX 10.29+)
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
board_build.ldscript = eagle.flash.4m2m.ld
monitor_speed = 9600
upload_speed = 460800
build_flags =
  -DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
  -Wall
lib_ldf_mode = deep+
