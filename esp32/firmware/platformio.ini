[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 460800

[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags = -D ASTRODRIVE_BOARD=\"esp32dev\"

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
build_flags = -D ASTRODRIVE_BOARD=\"nodemcuv2\"
