name: Lint & Security Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Shell syntax check (bash -n) & ShellCheck
        run: |
          shopt -s globstar nullglob
          SCRIPTS=(setup.sh install.sh firmware/build.sh scripts/*.sh)
          for f in "${SCRIPTS[@]}"; do
            echo "==> bash -n ${f}"
            bash -n "${f}"
          done
          shellcheck -S warning "${SCRIPTS[@]}"

      - name: Python bytecode compile & module import smoke check (globbed)
        run: |
          python3 -m pip install --quiet 'numpy>=1.24,<3' 'pillow>=10,<12' 'pyserial>=3.5,<4'
          shopt -s globstar nullglob
          PY_FILES=(scripts/*.py webui/*.py tests/*.py)
          python3 -m py_compile "${PY_FILES[@]}"
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          sys.path.insert(0, "webui")
          for mod in ("onstep_common", "probe_onstep", "onstep_provision", "onstep_camera", "onstep_webui"):
              __import__(mod)
              print(f"[IMPORT OK] {mod}")
          PY

      - name: Unit tests (EAA LiveStacker + R1 config + R6 manifest)
        run: python3 tests/test_camera_stacker.py

      - name: JavaScript syntax check (overlay.js + all index.html script blocks)
        run: |
          node --check webui/overlay.js
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("webui/index.html", "utf8");
            const re = /<script\b[^>]*>([\s\S]*?)<\/script>/gi;
            let count = 0, m;
            while ((m = re.exec(html)) !== null) {
              if (m[1].trim()) {
                new Function(m[1]);
                count++;
              }
            }
            if (count === 0) throw new Error("Missing <script> block in webui/index.html");
            console.log(`webui/index.html inline JS OK (${count} script block(s))`);
          '

      - name: Isolated install.sh end-to-end execution test (R16)
        run: |
          TMP_ROOT="$(mktemp -d)"
          trap 'rm -rf "${TMP_ROOT}"' EXIT
          chmod +x install.sh
          ASTRODRIVE_ROOT_PREFIX="${TMP_ROOT}" ASTRODRIVE_SKIP_PIP="true" \
            ./install.sh --chroot --without-camera --github-repo 0denko/AstroDrive
          # Verify critical files & token permissions (0640)
          test -f "${TMP_ROOT}/etc/onstep-autoprovision/config.env"
          test -f "${TMP_ROOT}/etc/onstep-autoprovision/install-meta.env"
          test -f "${TMP_ROOT}/etc/onstep-autoprovision/webui.token"
          test "$(stat -c %a "${TMP_ROOT}/etc/onstep-autoprovision/webui.token")" = "640"
          test -x "${TMP_ROOT}/opt/onstep-autoprovision/scripts/onstep_camera.py"
          test -f "${TMP_ROOT}/etc/systemd/system/onstep-camera.service"
          test -f "${TMP_ROOT}/etc/udev/rules.d/99-onstep-camera.rules"
          # Idempotent re-run must repair loosened token permissions and succeed cleanly
          chmod 0644 "${TMP_ROOT}/etc/onstep-autoprovision/webui.token"
          ASTRODRIVE_ROOT_PREFIX="${TMP_ROOT}" ASTRODRIVE_SKIP_PIP="true" \
            ./install.sh --chroot --without-camera --github-repo 0denko/AstroDrive
          test "$(stat -c %a "${TMP_ROOT}/etc/onstep-autoprovision/webui.token")" = "640"
          echo "ISOLATED install.sh EXECUTION TEST PASSED!"

      - name: Web UI authentication, session token & API security smoke test
        run: |
          python3 - <<'PY'
          import json, os, socket, subprocess, sys, tempfile, time, urllib.error, urllib.request
          from pathlib import Path

          def wait_port(host: str, port: int, timeout: float = 8.0) -> None:
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  try:
                      with socket.create_connection((host, port), timeout=0.3):
                          return
                  except OSError:
                      time.sleep(0.1)
              raise RuntimeError(f"Server did not open {host}:{port} within {timeout}s")

          with tempfile.TemporaryDirectory() as td:
              td_p = Path(td)
              tok = "b" * 32
              tok_file = td_p / "webui.token"
              tok_file.write_text(tok + "\n")
              cfg_file = td_p / "config.env"
              cfg_file.write_text('AUTO_FLASH="false"\nCAMERA_ENABLED="false"\nGITHUB_REPO="0denko/AstroDrive"\n')
              state_dir = td_p / "state"
              captures_dir = state_dir / "captures"
              captures_dir.mkdir(parents=True)
              (captures_dir / "astrodrive-20261121-010203-123.png").write_bytes(b"\x89PNG\r\n\x1a\ntest")
              preview_file = td_p / "preview.jpg"
              preview_file.write_bytes(b"\xff\xd8\xff\xe0testjpg")
              cam_status_file = td_p / "camera-status.json"
              cam_status_file.write_text(json.dumps({"state": "disconnected", "enabled": False}))
              fw_dir = td_p / "fw"
              fw_dir.mkdir()

              env = os.environ.copy()
              env.update({
                  "WEBUI_HOST": "127.0.0.1",
                  "WEBUI_PORT": "18092",
                  "ONSTEP_TOKEN_FILE": str(tok_file),
                  "ONSTEP_CONFIG_FILE": str(cfg_file),
                  "ONSTEP_STATE_DIR": str(state_dir),
                  "CAMERA_PREVIEW_FILE": str(preview_file),
                  "CAMERA_STATUS_FILE": str(cam_status_file),
                  "FIRMWARE_DIR": str(fw_dir),
              })
              proc = subprocess.Popen([sys.executable, "webui/onstep_webui.py"], env=env)
              try:
                  wait_port("127.0.0.1", 18092)
                  # Unauthenticated GET /api/status must be redacted (no config/camera/usb_devices/network)
                  with urllib.request.urlopen("http://127.0.0.1:18092/api/status", timeout=5) as r:
                      st = json.loads(r.read())
                      assert st["authenticated"] is False
                      assert "config" not in st and "usb_devices" not in st and "network" not in st and "camera" not in st

                  # Unauthenticated GET /api/logs, /api/status?probe=1, and ALL camera GET routes must return 401
                  for path in (
                      "/api/logs",
                      "/api/status?probe=1",
                      "/api/camera/preview.jpg",
                      "/api/camera/captures",
                      "/api/camera/captures/astrodrive-20261121-010203-123.png",
                  ):
                      try:
                          urllib.request.urlopen(f"http://127.0.0.1:18092{path}", timeout=5)
                          raise AssertionError(f"Expected 401 for unauthenticated GET {path}")
                      except urllib.error.HTTPError as e:
                          assert e.code == 401, (path, e.code)

                  # Unauthenticated POSTs (mount + camera) must return 401
                  for path in (
                      "/api/config",
                      "/api/action/provision",
                      "/api/action/update-cache",
                      "/api/action/sync-time",
                      "/api/camera/config",
                      "/api/camera/action/stack-reset",
                      "/api/camera/action/lock-auto",
                  ):
                      req = urllib.request.Request(
                          f"http://127.0.0.1:18092{path}",
                          data=b"{}",
                          headers={"Content-Type": "application/json"},
                          method="POST",
                      )
                      try:
                          urllib.request.urlopen(req, timeout=5)
                          raise AssertionError(f"Expected 401 for unauthenticated POST {path}")
                      except urllib.error.HTTPError as e:
                          assert e.code == 401, (path, e.code)

                  # R8: Exchange Setup PIN for 12h session_token and use session_token for subsequent requests
                  req = urllib.request.Request(
                      "http://127.0.0.1:18092/api/auth/verify",
                      data=b"{}",
                      headers={"Content-Type": "application/json", "X-AstroDrive-Token": tok},
                      method="POST",
                  )
                  with urllib.request.urlopen(req, timeout=5) as r:
                      auth_res = json.loads(r.read())
                      sess_tok = auth_res["session_token"]
                      assert sess_tok.startswith("sess_") and auth_res["expires_in_sec"] > 0

                  # Authenticated GET /api/status using session_token returns full payload including camera
                  req = urllib.request.Request(
                      "http://127.0.0.1:18092/api/status",
                      headers={"X-AstroDrive-Token": sess_tok},
                  )
                  with urllib.request.urlopen(req, timeout=5) as r:
                      st = json.loads(r.read())
                      assert st["authenticated"] is True and "config" in st and "health" in st and "camera" in st

                  # Authenticated GET /api/logs & camera preview & captures succeed
                  for path in ("/api/logs", "/api/camera/preview.jpg", "/api/camera/captures", "/api/camera/captures/astrodrive-20261121-010203-123.png"):
                      req = urllib.request.Request(f"http://127.0.0.1:18092{path}", headers={"X-AstroDrive-Token": sess_tok})
                      with urllib.request.urlopen(req, timeout=5) as r:
                          assert r.status == 200, (path, r.status)

                  # Path traversal / invalid capture filenames must be rejected with 400
                  for bad in ("/api/camera/captures/..%2F..%2Fetc%2Fpasswd", "/api/camera/captures/evil.png"):
                      req = urllib.request.Request(f"http://127.0.0.1:18092{bad}", headers={"X-AstroDrive-Token": sess_tok})
                      try:
                          urllib.request.urlopen(req, timeout=5)
                          raise AssertionError(f"Expected 400 for {bad}")
                      except urllib.error.HTTPError as e:
                          assert e.code == 400, (bad, e.code)

                  # Authenticated POST /api/camera/config & action succeed and write IPC files
                  req = urllib.request.Request(
                      "http://127.0.0.1:18092/api/camera/config",
                      data=json.dumps({"mode": "fixed_ref", "keep_pct": 25, "stretch_asinh": 6.5}).encode(),
                      headers={"Content-Type": "application/json", "X-AstroDrive-Token": sess_tok},
                      method="POST",
                  )
                  with urllib.request.urlopen(req, timeout=5) as r:
                      assert r.status == 200
                  assert (state_dir / "camera-cmd" / "config.json").is_file()

                  req = urllib.request.Request(
                      "http://127.0.0.1:18092/api/camera/action/lock-auto",
                      data=b"{}",
                      headers={"Content-Type": "application/json", "X-AstroDrive-Token": sess_tok},
                      method="POST",
                  )
                  with urllib.request.urlopen(req, timeout=5) as r:
                      assert r.status == 200
                  assert list((state_dir / "camera-cmd").glob("action-*.json"))

                  # GITHUB_REPO mutation must be rejected with 400
                  req = urllib.request.Request(
                      "http://127.0.0.1:18092/api/config",
                      data=json.dumps({"GITHUB_REPO": "attacker/evil"}).encode(),
                      headers={"Content-Type": "application/json", "X-AstroDrive-Token": sess_tok},
                      method="POST",
                  )
                  try:
                      urllib.request.urlopen(req, timeout=5)
                      raise AssertionError("Expected 400 for GITHUB_REPO mutation")
                  except urllib.error.HTTPError as e:
                      assert e.code == 400

                  print("ALL CI LINT & SECURITY SMOKE TESTS PASSED!")
              finally:
                  proc.terminate()
                  proc.wait(timeout=5)
          PY
