# /etc/nginx/snippets/onstep-astroberry-overlay.conf
#
# Upgrade-safe Astroberry OS UI overlay:
#   1. Proxies http://astroberry.local/onstep/ -> 127.0.0.1:8090 (onstep-webui.service)
#   2. Injects <script src="/onstep/overlay.js" defer></script> into Astroberry Manager
#      HTML responses so the OnStepX live status pill + drawer appear natively inside
#      Astroberry OS without modifying any files owned by `astroberry-manager`.

location ^~ /onstep/ {
    proxy_pass http://127.0.0.1:8090/onstep/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
}

# Inject overlay.js into Astroberry Manager HTML responses
proxy_set_header Accept-Encoding "";
sub_filter '</body>' '<script src="/onstep/overlay.js" defer></script></body>';
sub_filter_once on;
sub_filter_types text/html;
